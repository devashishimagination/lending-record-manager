<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2d52">
  <title>People - Lending Records</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="page-head">
      <h1 class="page-title">People</h1>
      <button class="btn" id="addBtn">+ Add person</button>
    </div>
    <p id="error" class="error"></p>

    <input id="search" class="search" type="search" placeholder="Search by name or phone">
    <section class="panel"><div id="peopleList" class="list"></div></section>
  </main>

  <dialog id="personDialog">
    <h2>Add person</h2>
    <form id="personForm">
      <label for="name">Name *</label>
      <input id="name" required maxlength="100">
      <label for="phone">Phone</label>
      <input id="phone" type="tel" maxlength="20">
      <label for="notes">Notes</label>
      <textarea id="notes" rows="2" maxlength="300"></textarea>
      <div class="actions">
        <button type="button" class="btn light" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>
  </dialog>

  <nav id="app-bottom"></nav>
  <script src="js/common.js"></script>
  <script src="js/people.js"></script>
</body>
</html>
