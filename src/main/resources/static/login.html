<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lending">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2d52">
  <title>Sign in - Lending Records</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <main class="login-box">
    <div class="login-logo">&#128213;</div>
    <h1>BAHI KHATA</h1>
    <p id="msg" class="error" hidden>Wrong password. Please try again.</p>
    <form method="post" action="/login">
      <input type="hidden" name="username" value="owner">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="btn" style="width:100%">Sign in</button>
    </form>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
