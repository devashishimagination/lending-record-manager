<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2d52">
  <title>Dashboard - Lending Records</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main>
    <h1 class="page-title">Dashboard</h1>
    <p id="error" class="error"></p>

    <section class="cards">
      <div class="card given"><h2>To receive (money given)</h2><p id="totalGiven">-</p></div>
      <div class="card taken"><h2>To pay (money taken)</h2><p id="totalTaken">-</p></div>
      <div class="card kept"><h2>Kept with me</h2><p id="totalKept">-</p></div>
    </section>

    <section class="panel">
      <h2>Overdue <span class="badge warn" id="overdueCount">0</span></h2>
      <div id="overdueList" class="list"></div>
    </section>

    <section class="panel">
      <h2>To call <span class="badge" id="toCallCount">0</span></h2>
      <div id="toCallList" class="list"></div>
    </section>
  </main>

  <nav id="app-bottom"></nav>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
